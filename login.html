<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#06080c" />
  <title>Sign in | Hoodoo Alaska</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=5" />
</head>
<body class="login-portal">
  <a class="skip-link" href="#login-card">Skip to sign in</a>

  <div class="login-portal__glow" aria-hidden="true"></div>
  <a class="login-portal__home" href="/">← Hoodoo Alaska</a>

  <main class="login-portal__main" id="login-card">
    <article class="login-portal__card" aria-labelledby="login-title">
      <div class="login-portal__brand">
        <div class="login-portal__logo" aria-hidden="true">HA</div>
        <div class="login-portal__brand-text">
          <h1 id="login-title" class="login-portal__title">Hoodoo Alaska Login</h1>
          <p class="login-portal__subtitle">
            Staff sign-in. The online shop and configurator are in progress and not open to the public.
          </p>
        </div>
      </div>

      <form id="login-form" class="login-portal__form" novalidate>
        <label class="login-portal__field">
          <span class="login-portal__label">Username</span>
          <input type="text" name="login" id="login-id" autocomplete="username" required placeholder="Email or username" />
        </label>
        <label class="login-portal__field">
          <span class="login-portal__label">Password</span>
          <input type="password" name="password" id="login-password" autocomplete="current-password" required placeholder="••••••••" />
        </label>

        <div class="login-portal__row">
          <label class="login-portal__remember">
            <input type="checkbox" id="login-remember" name="remember" checked />
            <span>Remember me</span>
          </label>
          <a class="login-portal__help" href="/forgot-password">Need help?</a>
        </div>

        <button type="submit" class="login-portal__submit">Login</button>
      </form>

      <p id="login-feedback" class="login-portal__feedback" role="status" aria-live="polite"></p>

      <p class="login-portal__disclaimer">
        For custom jumpsuits, apparel, and branding, contact the shop:
        <a href="mailto:shannnon@hoodooak.com">shannnon@hoodooak.com</a>
        · <a href="tel:+19072025634">907.202.5634</a>
      </p>

      <nav class="login-portal__footer-nav" aria-label="Site shortcuts">
        <a href="/">Home</a>
      </nav>
    </article>
  </main>

  <script src="/js/api.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var next = params.get("next") || "/configurator.html";
      if (next.charAt(0) !== "/" || next.indexOf("//") === 0) next = "/configurator.html";
      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var fb = document.getElementById("login-feedback");
        fb.textContent = "";
        fb.classList.remove("login-portal__feedback--ok", "login-portal__feedback--err");
        var loginId = document.getElementById("login-id").value.trim();
        var password = document.getElementById("login-password").value;
        var remember = document.getElementById("login-remember").checked;
        var body = new URLSearchParams({ username: loginId, password: password, grant_type: "password" });
        fetch((window.HoodooApi && window.HoodooApi.apiUrl) ? window.HoodooApi.apiUrl("/auth/token") : "/api/auth/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
          credentials: "same-origin",
        })
          .then(function (r) {
            return r.text().then(function (text) {
              return window.HoodooApi.parseResponse(r, text);
            });
          })
          .then(function (result) {
            if (!result.ok) {
              fb.classList.add("login-portal__feedback--err");
              fb.textContent = result.error || "Sign in failed";
              return;
            }
            var tok = result.data;
            if (!tok || !tok.access_token) {
              fb.classList.add("login-portal__feedback--err");
              fb.textContent = "Invalid response from server.";
              return;
            }
            window.HoodooApi.setToken(tok.access_token, remember);
            window.HoodooApi.fetchJson("/auth/me")
              .then(function (u) {
                var isStaff = u && (u.role === "staff" || u.role === "admin");
                location.href = isStaff ? next : "/";
              })
              .catch(function () {
                location.href = "/";
              });
          })
          .catch(function (err) {
            fb.classList.add("login-portal__feedback--err");
            fb.textContent = (err && err.message) || "Network error — try again.";
          });
      });
    })();
  </script>
</body>
</html>
