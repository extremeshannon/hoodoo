# Hoodoo Alaska — FastAPI + PostgreSQL + static UI (service name: api)
# http://localhost:8004/           → site
# http://localhost:8004/api/health → {"status":"ok"}
#
# If /api/health shows HTML, an old nginx-only container may still own port 8004.
# Run: docker ps   then stop/remove the old web container and: docker compose up -d --build
#
# Local-only bind:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: hoodoo_db
    environment:
      POSTGRES_USER: hoodoo
      POSTGRES_PASSWORD: hoodoo
      POSTGRES_DB: hoodoo
    volumes:
      - hoodoo_pg:/var/lib/postgresql/data
    # Loopback only if published; prod override removes host ports entirely.
    ports:
      - "127.0.0.1:5435:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoodoo -d hoodoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: hoodoo_api
    ports:
      - "127.0.0.1:8004:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://hoodoo:hoodoo@db:5432/hoodoo
      REPO_ROOT: /app
      PUBLIC_BASE_URL: http://localhost:8004
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./data:/app/data
      - ./js:/app/js
      - ./3d:/app/3d
      - ./assets:/app/assets
      - ./index.html:/app/index.html
      - ./login.html:/app/login.html
      - ./register.html:/app/register.html
      - ./account.html:/app/account.html
      - ./order.html:/app/order.html
      - ./viewer.html:/app/viewer.html
      - ./admin.html:/app/admin.html
      - ./quote.html:/app/quote.html
      - ./quote.css:/app/quote.css
      - ./pricing.html:/app/pricing.html
      - ./suit.html:/app/suit.html
      - ./suit.css:/app/suit.css
      - ./dyesub.html:/app/dyesub.html
      - ./dyesub.css:/app/dyesub.css
      - ./screenprint.html:/app/screenprint.html
      - ./screenprint.css:/app/screenprint.css
      - ./embroidery.html:/app/embroidery.html
      - ./embroidery.css:/app/embroidery.css
      - ./configurator.html:/app/configurator.html
      - ./configurator.css:/app/configurator.css
      - ./configurator.js:/app/configurator.js
      - ./cart.html:/app/cart.html
      - ./cart.js:/app/cart.js
      - ./styles.css:/app/styles.css
      - ./main.js:/app/main.js
    depends_on:
      db:
        condition: service_healthy

volumes:
  hoodoo_pg:

networks:
  default:
    name: hoodoo_internal
