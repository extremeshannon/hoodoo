<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#06080c" />
  <title>Set new password | Hoodoo Alaska</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=5" />
</head>
<body class="login-portal">
  <a class="skip-link" href="#reset-card">Skip to form</a>

  <div class="login-portal__glow" aria-hidden="true"></div>
  <a class="login-portal__home" href="/login">← Back to sign in</a>

  <main class="login-portal__main" id="reset-card">
    <article class="login-portal__card" aria-labelledby="reset-title">
      <div class="login-portal__brand">
        <div class="login-portal__logo" aria-hidden="true">HA</div>
        <div class="login-portal__brand-text">
          <h1 id="reset-title" class="login-portal__title">Choose a new password</h1>
          <p class="login-portal__subtitle" id="reset-lede">
            Use the link from your email (or from the server log in local dev). Tokens expire after 24 hours.
          </p>
        </div>
      </div>

      <form id="reset-form" class="login-portal__form" novalidate>
        <input type="hidden" id="reset-token" name="token" value="" />
        <label class="login-portal__field">
          <span class="login-portal__label">New password</span>
          <input type="password" id="reset-password-1" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
        </label>
        <label class="login-portal__field">
          <span class="login-portal__label">Confirm password</span>
          <input type="password" id="reset-password-2" autocomplete="new-password" required minlength="8" placeholder="Repeat password" />
        </label>
        <button type="submit" class="login-portal__submit">Update password</button>
      </form>

      <p id="reset-feedback" class="login-portal__feedback" role="status" aria-live="polite"></p>

      <nav class="login-portal__footer-nav" aria-label="Account">
        <a href="/login">Sign in</a>
        <span class="login-portal__sep" aria-hidden="true">•</span>
        <a href="/forgot-password">Request new link</a>
      </nav>
    </article>
  </main>

  <script src="/js/api.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var token = params.get("token") || "";
      document.getElementById("reset-token").value = token;
      if (!token) {
        document.getElementById("reset-lede").textContent =
          "Missing reset token. Open the full link from your email, or request a new reset from Forgot password.";
      }

      document.getElementById("reset-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var fb = document.getElementById("reset-feedback");
        fb.textContent = "";
        fb.classList.remove("login-portal__feedback--ok", "login-portal__feedback--err");
        var t = document.getElementById("reset-token").value.trim();
        var p1 = document.getElementById("reset-password-1").value;
        var p2 = document.getElementById("reset-password-2").value;
        if (!t) {
          fb.textContent = "No reset token. Use the link from your email or request a new one.";
          fb.classList.add("login-portal__feedback--err");
          return;
        }
        if (p1 !== p2) {
          fb.textContent = "Passwords do not match.";
          fb.classList.add("login-portal__feedback--err");
          return;
        }
        window.HoodooApi
          .fetchJson("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ token: t, password: p1 }),
          })
          .then(function (res) {
            fb.textContent = res.message || "Password updated.";
            fb.classList.add("login-portal__feedback--ok");
            setTimeout(function () {
              location.href = "/login";
            }, 1600);
          })
          .catch(function (err) {
            fb.textContent = err.message || "Reset failed.";
            fb.classList.add("login-portal__feedback--err");
          });
      });
    })();
  </script>
</body>
</html>
